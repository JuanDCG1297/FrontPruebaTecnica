<!--
  ======================================================================
  APP COMPONENT — Template HTML (Layout Shell)
  ======================================================================
  Layout principal: sidebar izquierdo + contenido vía <router-outlet>.

  El sidebar siempre está visible. El contenido cambia según la ruta.
  Cuando navegás, solo se re-renderiza el contenido, no el sidebar.
  Eso es porque <router-outlet /> está FUERA del sidebar.
-->

<div class="app-shell">
  <!-- ────────────────────────────────────────────────────────────── -->
  <!-- SIDEBAR                                                        -->
  <!-- ────────────────────────────────────────────────────────────── -->
  <aside class="sidebar">
    <!-- Marca -->
    <div class="sidebar__brand">
      <h1 class="sidebar__title">Parqueadero</h1>
      <p class="sidebar__subtitle">Sistema de Gestión</p>
    </div>

    <!-- Navegación -->
    <nav class="sidebar__nav">
      @for (item of navItems; track item.path) {
        <!--
          routerLink → navegación SPA sin recargar la página
          routerLinkActive → agrega clase CSS cuando la ruta coincide
          routerLinkActiveOptions → exact:false (coincidencia parcial)
        -->
        <a
          class="nav-link"
          [routerLink]="item.path"
          routerLinkActive="nav-link--active"
          [routerLinkActiveOptions]="{ exact: false }"
        >
          <span class="nav-link__icon">{{ item.icon }}</span>
          <span class="nav-link__label">{{ item.label }}</span>
        </a>
      }
    </nav>

    <!-- Footer -->
    <div class="sidebar__footer">
      <small>Prueba Técnica</small>
    </div>
  </aside>

  <!-- ────────────────────────────────────────────────────────────── -->
  <!-- MAIN CONTENT                                                   -->
  <!-- ────────────────────────────────────────────────────────────── -->
  <main class="main-content">
    <!--
      router-outlet renderiza el componente de la ruta activa.
      Ej: /ingreso → VehicleEntryComponent, /salida → VehicleExitComponent
    -->
    <router-outlet />
  </main>
</div>
